name: Full Time predictions
# Every 3 hours (8 Odds API calls a day, well inside the free 500 a month).
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: full-time
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I score-predictor/predict.py "$RUNNER_TEMP/out.json" score-predictor/data.json
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - run: .github/scripts/commit.sh score-predictor/data.json "$RUNNER_TEMP/out.json" "data: refresh Full Time"
