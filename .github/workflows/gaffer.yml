name: Gaffer FPL refresh
# Every 3 hours, so the last run before each deadline has the latest predicted lineups and injury news.
on:
  schedule:
    - cron: "53 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gaffer
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I fpl-helper/fetch.py 853712 "$RUNNER_TEMP/data"
      - run: python3 -I fpl-helper/model.py 853712 "$RUNNER_TEMP/data" "$RUNNER_TEMP/out.json"
      - run: .github/scripts/commit.sh fpl-helper/data.json "$RUNNER_TEMP/out.json" "data: refresh Gaffer"
