name: Card Sharp picks
# Hourly at :50, so confirmed lineups (out about an hour before kick-off) are in before every game.
on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: card-sharp
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I card-sharp/picks.py "$RUNNER_TEMP/out.json" card-sharp/data.json
      - run: .github/scripts/commit.sh card-sharp/data.json "$RUNNER_TEMP/out.json" "data: refresh Card Sharp picks"
